[package]
name = "dispatch"
version = "1.2.0"
description = "SFTP and FTP client for macOS"
license = "GPL-3.0-or-later"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The program file is named like the app, so the Dock shows "Dispatch" in development too.
[[bin]]
name = "Dispatch"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
suppaftp = { version = "12.2.1", features = ["tokio-async-native-tls", "deprecated"] }
russh = "0.65.0"
russh-sftp = "3.0.1"
keyring = "4.2.0"
trash = "5.2.9"
dirs = "7.0.0"
thiserror = "2.0.21"
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.4"
roxmltree = "0.21.2"
base64 = "0.23.1"
plist = "1.10.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
